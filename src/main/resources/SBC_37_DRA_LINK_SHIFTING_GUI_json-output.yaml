# ---------------------------------------------------------------------------
# JSON output template SBC 37_DRA_LINK_SHIFTING_GUI
# ---------------------------------------------------------------------------
# This file is referenced from SBC_146_SDP_PROFILE_MODIFICATION_&_TG_MODIFICATION_IN_ISBC_validation-rules.yaml
# via:  json_output_file: "SBC_37_DRA_LINK_SHIFTING_GUI_json-output.yaml"
# ---------------------------------------------------------------------------
# It is also consumed directly by:
#   - JAVA_NOKIA_CLICR_AUTOMATION  (MOP generation + approval summary + execution reporting)
# ---------------------------------------------------------------------------
output_mode: single
data:
 schemaVersion: "2"
 meta:
   nodeType: SBC
   activity: SBC_37_DRA_LINK_SHIFTING_GUI
   tableKeys:
    _optional: true
    DiameterMultipleDestinationsProfileTable:
      recordPrimaryKeys: "FQDN_INDEX"
    
    SblpProfileTable:
      recordPrimaryKeys: "PROFILE_ID"

 nodeGroups:
   _each: "DISTINCT INDEX.NODEGROUP AS $ng"
   nodeGroup: $ng
   crGroup:   "INDEX.CRGROUP WHERE INDEX.NODEGROUP = $ng"
   email:     "INDEX.EMAIL WHERE INDEX.NODEGROUP = $ng"
   nodes:
     _each: "IP WHERE IP.NODEGROUP = $ng"
     node:   IP.NODE
     niamID: "IP.'NIAM NAME'"
   configSequences:
     _each: "DISTINCT INDEX.CONFIG_SEQ WHERE INDEX.NODEGROUP = $ng AS $seq"
     configSeq: $seq
     tables:
       _each: "DISTINCT INDEX.TABLES WHERE INDEX.NODEGROUP = $ng AND INDEX.CONFIG_SEQ = $seq AS $table"
       table:    $table
       category: "INDEX.CATEGORY WHERE INDEX.NODEGROUP = $ng AND INDEX.CONFIG_SEQ = $seq AND INDEX.TABLES = $table"
       records:
         _each: "$table WHERE NODEGROUP = $ng AND CONFIG_SEQ = $seq"
         data:
           _row: "*"
  