# ---------------------------------------------------------------------------
# JSON output template — SBC FIXED_LINE_CONFIGURATION
# ---------------------------------------------------------------------------
# This file is referenced from SBC_FIXED_LINE_CONFIGURATION_validation-rules.yaml
# via:  json_output_file: "SBC_FIXED_LINE_CONFIGURATION_json-output.yaml"
# ---------------------------------------------------------------------------
# It is also consumed directly by:
#   - JAVA_NOKIA_CLICR_AUTOMATION  (MOP generation + approval summary + execution reporting)
# ---------------------------------------------------------------------------
output_mode: single
data:
 nodeType: SBC
 activity: FIXED_LINE_CONFIGURATION
 tableKeys:
    CRFTargetList:
      recordPrimaryKeys: "TARGET_LIST_ID"
      subrecordKeys:
        CRFTargetListEntry: "TARGET_ID,VN_ID,TG_ID"

    PeeringSDPProfileTable:
      recordPrimaryKeys: "PROFILEID"
      subrecordKeys:
        CodecBandwidth: "CODEC"
        MsrpBandwidth:  "MSRP_MEDIA_TYPE"

    BorderGatewayPublishedRealmTable:
      recordPrimaryKeys: "BORDER_GATEWAY"
      subrecordKeys:
        PUBLISHED_REALM_ENTRY: "PUBLISHED_REALM_ID"

    IbcfVirtualNetworkTable:
      recordPrimaryKeys: "VN_ID"

    ServiceProfileTable:
      recordPrimaryKeys: "POLICY_ID"

    PFEDPortTable:
      recordPrimaryKeys: "PFED_ID,PORT_NAME"

    PublishedRealmTable:
      recordPrimaryKeys: "PUBLISHED_REALM_ID"

    IbcfSipProfileTable:
      recordPrimaryKeys: "PROFILE_ID"

    IbcfTrunkGroupTable:
      recordPrimaryKeys: "VN_ID,TG_ID"

    CRFDATable:
      recordPrimaryKeys: "DIGIT_STRING"

    CRFRoutePlan:
      recordPrimaryKeys: "RT_PLAN_ID"

    CRFRoutePriorityList:
      recordPrimaryKeys: "PRIORITY_LIST_ID"
      subrecordKeys:
        CRFRoutePriorityListEntry: "PLAN_TYPE,PLAN_ID"

    CRFRouteProfile:
      recordPrimaryKeys: "ROUTE_PROFILE_ID"

    CRFTreatment:
      recordPrimaryKeys: "TREATMENT_ID"

    CRFHostURITable:
      recordPrimaryKeys: "HOST_URI,HOST_URI_TYPE"

    IbcfIngressTrunkGroupMappingTable:
      recordPrimaryKeys: "POLICY_ID"
 nodes:
   _each: "DISTINCT INDEX.NODE AS $node"
   node:    $node
   niamID:  "IP.'NIAM NAME' WHERE IP.NODE = $node"
   crGroup: INDEX.CRGROUP
   Group:
     _join: "INDEX.GROUP"
   email:   INDEX.EMAIL
   tableData:
     _each: "INDEX WHERE INDEX.NODE = $node"
     table_row: INDEX.TABLES
     group:     GROUP
     category:  CATEGORY
     records:
       _each: "INDEX.TABLES WHERE GROUP = GROUP"
       data:
         _row: "*"
