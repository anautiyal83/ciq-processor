              operator: equals
              value: CREATE
            - column: SubAction
              operator: equals
              value: TABLE
      - unique_key: [NodeGroup, CONFIG_SEQ, ID, NAME]
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: SubAction
              operator: equals
              value: TABLE

