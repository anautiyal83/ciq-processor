          allowedValues: [None]
        - column: Record.TREATMENT_TYPE
          operator: equals
          value: "Continue Re-Route"
          allowedValues: [None]
        - column: Record.TREATMENT_TYPE
          operator: equals
          value: "SIP Error Response"
          allowedValues: [403 Forbidden, 404 Not Found, 480 Temporarily Not Available, 486 Busy Here, 500 Internal Error, 503 Service Unavailable]
        - column: Record.TREATMENT_TYPE
          operator: equals
          value: "Continue With"
          allowedValues: [CM-Call-Disposition]
        description: "Required when Action is CREATE; value depends on TREATMENT_TYPE"

    rules:
      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD
      - require: '"Record.TREATMENT_TYPE"'
        when:
          column: Action
          operator: equals
          value: CREATE

  # ---------------------------------------------------------------------------
  # Sheet: CRFHostURITable
  # ---------------------------------------------------------------------------
  CRFHostURITable:
    required: false
    required_if_listed_in: Index.TABLES
    columns:

      Group:
        required: true
        type: string

      Action:
        required: true
        type: string
        allowedValues: [CREATE, DELETE, MODIFY]

      SubAction:
        required: true
        type: string
        allowedValues: [RECORD]

      ActionKey:
        required: false
        type: string

      ID:
        required: true
        type: integer
        minValue: 1
        maxValue: 6000

      NAME:
        required: true
        type: string
        maxLength: 19
        pattern: "(\\S|\\S[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*\\S)"

      Record.HOST_URI:
        required: true
        type: string
        unique: true
        minLength: 1
        maxLength: 128
        description: "Required when Action is CREATE"

      Record.HOST_URI_TYPE:
        required: true
        type: string
        unique: true
        allowedValues: [IPv4, IPv6, Domain]
        description: "Required when Action is CREATE"

      Record.NETMASK:
        required: false
        type: integer
        minValue: 0
        maxValue: 128
        description: "Required when Action is CREATE; valid for IPv4 and IPv6 only"

      Record.CRF_TREATMENT_ID:
        required: false
        type: string
        pattern: "^(None|100000|[1-9][0-9]{0,4})$"
        description: "Required when Action is CREATE; equal to CRFTreatment.TREATMENT_ID"

    rules:
      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD

  # ---------------------------------------------------------------------------
  # Sheet: IbcfIngressTrunkGroupMappingTable (Excel sheet name is truncated to 31 chars)
  # ---------------------------------------------------------------------------
  IbcfIngressTrunkGroupMappingTable:
    aliases:
      - IbcfIngressTrunkGroupMappingTab
    required: false
    required_if_listed_in: Index.TABLES
    columns:

      Group:
        required: true
        type: string

      Action:
        required: true
        type: string
        allowedValues: [CREATE, DELETE, MODIFY]

      SubAction:
        required: true
        type: string
        allowedValues: [RECORD]

      ActionKey:
        required: false
        type: string
      ID:
        required: true
        type: integer
        minValue: 0
        maxValue: 1628

      NAME:
        required: true
        type: string
        maxLength: 19
        pattern: "(\\S|\\S[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*\\S)"

      Record.POLICY_ID:
        required: true
        type: integer
        unique: true
        minValue: 1
        maxValue: 10000

      Record.IBCF_VN_ID:
        required: false
        type: integer
        description: "Required when Action is CREATE; must match IbcfVirtualNetworkTable.VN_ID"

      Record.IBCF_TG_ID:
        required: false
        type: integer
        minValue: 1
        maxValue: 32
        description: "Required when Action is CREATE; must match IbcfTrunkGroupTable.TG_ID for given VN"

      Record.ADDRESS:
        required: false
        type: string
        allowedValues: [DEFAULT]
        description: "Required when Action is CREATE; Via header address or DEFAULT"

      Record.PORT:
        required: false
        type: string
        pattern: "^(NOTPRESENT|DEFAULT|[1-9][0-9]{0,4})$"
        allowedValuesWhen:
        - column: Record.ADDRESS
          operator: equals
          value: "DEFAULT"
          allowedValues: [DEFAULT]
        description: "Must be 'DEFAULT' when Record.ADDRESS is 'DEFAULT'. Allowed values: NOTPRESENT, DEFAULT, or numeric range 1-65535"

      Record.RFC4904_TGRP:
        required: false
        type: string
        allowedValues: [NOTPRESENT]
        description: "Required when Action is CREATE; TGRP or NOTPRESENT"

      Record.RFC4904_TRUNK_CONTEXT:
        required: false
        type: string
        allowedValues: [NOTPRESENT]
        description: "Required when Action is CREATE; Trunk-Context or NOTPRESENT"

      Record.CFED_PORT:
        required: false
        type: string
        allowedValues: [NOTPRESENT]
        description: "Required when Action is CREATE; CFED port name or NOTPRESENT"

    rules:
      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD
      - forbid: '"Record.ADDRESS"'
        when:
          column: Action
          operator: equals
          value: MODIFY
      - forbid: '"Record.PORT"'
        when:
          column: Action
          operator: equals
          value: MODIFY
      - forbid: '"Record.RFC4904_TGRP"'
        when:
          column: Action
          operator: equals
          value: MODIFY
      - forbid: '"Record.RFC4904_TRUNK_CONTEXT"'
        when:
          column: Action
          operator: equals
          value: MODIFY
outputs:
  # Distinct CR group identifiers from the Index sheet
  CR_LIST:
    sheet: Index
    column: CRGROUP
    aggregate: distinct
    separator: ","
 
  # Total number of announcement file rows
  CR_COUNT:
    sheet: Index
    column: CRGROUP
    aggregate: distinct_count