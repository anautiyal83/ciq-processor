  PFEDPortTable:
    required: false
    required_if_listed_in: Index.TABLES
    columns:

      Group:
        required: true
        type: string

      Action:
        required: true
        type: string
        allowedValues: [CREATE, DELETE, MODIFY]

      SubAction:
        required: true
        type: string
        allowedValues: [RECORD]

      ActionKey:
        required: false
        type: string

      ID:
        required: true
        type: integer
        minValue: 1
        maxValue: 99

      NAME:
        required: true
        type: string
        maxLength: 19
        pattern: "(\\S|\\S[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*\\S)"

      Record.PFED_ID:
        required: true
        type: string
        description: "Must match /PFEDServiceTable/Record/PFED_ID"

      Record.PORT_NAME:
        required: true
        type: string
        unique: true
        maxLength: 4
        pattern: "[a-z0-9]{4}"
        description: "Required when Action is CREATE; exactly 4 lowercase alphanumeric chars"

      Record.EXTERNAL_HOST_NAME:
        required: false
        type: string
        maxLength: 256
        description: "Required when Action is CREATE"

      Record.EXTERNAL_PORT_NUMBER:
        required: false
        type: integer
        minValue: 1024
        maxValue: 32767
        description: "Required when Action is CREATE"
        aliases:
          - EXTERNAL_PORT_NUMBER

      Record.ADMINISTRATIVE_STATE:
        required: false
        type: string
        allowedValues: [Unlocked, Locked]
        description: "Required when Action is CREATE"

      Record.OVERLOAD_SPECIAL_TREATMENT:
        required: false
        type: string
        allowedValues: ["Reject with 500", "Pass Through"]
        description: "Required when Action is CREATE"

      Record.INCLUDE_SERVER_PORT_IN_EXT_PFED_URI:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.TLS_PROFILE:
        required: false
        type: integer
        minValue: 0
        maxValue: 64
        description: "Required when Action is CREATE; 0 means no TLS profile"

      Record.TLS_SERVER_PORT:
        required: false
        type: integer
        minValue: 0
        description: "Required when Action is CREATE"
        aliases:
          - TLS_SERVER_PORT

      Record.PUBLISHED_V4_EXTERNAL_FLOATING_IP_ADDRESS:
        required: false
        type: string
        pattern: "((([0-1]?[0-9]?[0-9])|(2[0-4][0-9])|(25[0-5]))\\.){3}((25[0-5])|(2[0-4][0-9])|([0-1]?[0-9]?[0-9]))|No v4|"
        description: "Required when Action is CREATE; IPv4 address or 'No v4'"

      Record.PUBLISHED_V6_EXTERNAL_FLOATING_IP_ADDRESS:
        required: false
        type: string
        description: "Required when Action is CREATE; IPv6 address or 'No v6'"

      Record.IPV4_VLAN_ID:
        required: false
        type: integer
        minValue: 0
        maxValue: 4094
        description: "0 means no VLAN tagging"

      Record.IPV6_VLAN_ID:
        required: false
        type: integer
        minValue: 0
        maxValue: 4094
        description: "0 means no VLAN tagging"

      Record.EIPM_MONITOR_MODE:
        required: false
        type: string
        allowedValues: [Disabled, Heartbeat-only, Monitor]
        description: "Required when Action is CREATE"

      Record.IPSEC_ALLOWED:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.SECONDARY_PUBLISHED_V4_EXTERNAL_FLOATING_IP_ADDRESS:
        required: false
        type: string
        pattern: "((([0-1]?[0-9]?[0-9])|(2[0-4][0-9])|(25[0-5]))\\.){3}((25[0-5])|(2[0-4][0-9])|([0-1]?[0-9]?[0-9]))|No v4|"
        description: "Required when Action is CREATE; secondary IPv4 address or 'No v4' or empty"

      Record.SECONDARY_PUBLISHED_V6_EXTERNAL_FLOATING_IP_ADDRESS:
        required: false
        type: string
        description: "Required when Action is CREATE; secondary IPv6 address or 'No v6' or empty"

      Record.IPSEC_LOCAL_SERVER_PORT:
        required: false
        type: integer
        allowedRanges:
          - { min: 0, max: 0 }
          - { min: 1024, max: 32767 }
        description: "Required when Action is CREATE; 0 or 1024..32767; provisioned only when IPSEC_ALLOWED is Yes"

      Record.IKE_LOCAL_SERVER_PORT:
        required: false
        type: integer
        allowedRanges:
          - { min: 0, max: 0 }
          - { min: 500, max: 500 }
          - { min: 1024, max: 32767 }
        description: "Required when Action is CREATE; 0, 500, or 1024..32767; provisioned only when IPSEC_ALLOWED is Yes"

      Record.SIP_DSCP:
        required: false
        type: integer
        minValue: 0
        maxValue: 63
        description: "Required when Action is CREATE; 0..63 or empty; when empty uses SIP DSCP from PFED Service Data"

      Record.SIP_FILTER_SET_ID:
        required: false
        type: integer
        allowedRanges:
          - { min: 0, max: 0 }
          - { min: 1, max: 600 }
        description: "0 = SIP message screening not configured; 1..600 = Filter Set ID from SIP Filter Set table"

    rules:
      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD
      
      - compare: TLS_SERVER_PORT notEquals EXTERNAL_PORT_NUMBER
        when:
          column: Action
          operator: equals
          value: CREATE

