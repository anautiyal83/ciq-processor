# =============================================================================
# Validation Rules: SBC - FIXED_LINE_CONFIGURATION
# File naming convention: {NODE_TYPE}_{ACTIVITY}_validation-rules.yaml
#
# Use-case:
#   Validate SBC Fixed Line Configuration CIQ sheets.
#   Covers 18 sheets: Index, IP, and 16 record-based configuration tables.
# =============================================================================

version: "1.0"

# -----------------------------------------------------------------------------
# Global settings
# -----------------------------------------------------------------------------
settings:
  headerRow: 0
  dataStartRow: 1
  trimCellValues: true
  ignoreBlankRows: true
  caseSensitiveHeaders: false
  caseSensitiveValues: true

# -----------------------------------------------------------------------------
# Workbook-level cross-sheet rules
# -----------------------------------------------------------------------------
workbook_rules:

  # Index.NODE must exist in IP.NODE
  - match:
      from: Index.NODE
      to: IP.NODE

  # GROUP validation scoped by TABLES column.
  # Each match only checks Index.GROUP values where Index.TABLES = the target sheet.
  # This prevents false failures when different tables use different group names.
  - match:
      from: Index.GROUP
      where: "TABLES = CRFTargetList"
      to: CRFTargetList.Group
  - match:
      from: Index.GROUP
      where: "TABLES = PeeringSDPProfileTable"
      to: PeeringSDPProfileTable.Group
  - match:
      from: Index.GROUP
      where: "TABLES = BorderGatewayPublishedRealmTable"
      to: BorderGatewayPublishedRealmTable.Group
  - match:
      from: Index.GROUP
      where: "TABLES = IbcfVirtualNetworkTable"
      to: IbcfVirtualNetworkTable.Group
  - match:
      from: Index.GROUP
      where: "TABLES = ServiceProfileTable"
      to: ServiceProfileTable.Group
  - match:
      from: Index.GROUP
      where: "TABLES = PFEDPortTable"
      to: PFEDPortTable.Group
  - match:
      from: Index.GROUP
      where: "TABLES = PublishedRealmTable"
      to: PublishedRealmTable.Group
  - match:
      from: Index.GROUP
      where: "TABLES = IbcfSipProfileTable"
      to: IbcfSipProfileTable.Group
  - match:
      from: Index.GROUP
      where: "TABLES = IbcfTrunkGroupTable"
      to: IbcfTrunkGroupTable.Group
  - match:
      from: Index.GROUP
      where: "TABLES = CRFDATable"
      to: CRFDATable.Group
  - match:
      from: Index.GROUP
      where: "TABLES = CRFRoutePlan"
      to: CRFRoutePlan.Group
  - match:
      from: Index.GROUP
      where: "TABLES = CRFRoutePriorityList"
      to: CRFRoutePriorityList.Group
  - match:
      from: Index.GROUP
      where: "TABLES = CRFRouteProfile"
      to: CRFRouteProfile.Group
  - match:
      from: Index.GROUP
      where: "TABLES = CRFTreatment"
      to: CRFTreatment.Group
  - match:
      from: Index.GROUP
      where: "TABLES = CRFHostURITable"
      to: CRFHostURITable.Group
  - match:
      from: Index.GROUP
      where: "TABLES = IbcfIngressTrunkGroupMappingTable"
      to: IbcfIngressTrunkGroupMappingTable.Group

# -----------------------------------------------------------------------------
# Sheet-wise validation rules
# -----------------------------------------------------------------------------
sheets:

  # ---------------------------------------------------------------------------
  # Sheet: Index
  # ---------------------------------------------------------------------------
  Index:
    required: true
    columns:

      NODE:
        required: true
        type: string
        pattern: ".*SBC.*"
        description: "SBC Hostname (must contain SBC)"

      GROUP:
        required: true
        type: string
        description: "Group name for the configuration changes"

      CRGROUP:
        required: true
        description: "CR Number"

      TABLES:
        required: true
        type: string
        description: "Table Name of Configuration"

      CATEGORY:
        required: true
        type: string
        allowedValues: [RecordBased, Global]
        description: "Category - RecordBased or Global level configuration"

      EMAIL:    
        type: email
        multi: true
        description: "Email ID"
        consolidate: true
        consolidate_separator: ";"
        minOnePerGroup:
            groupByColumn: CRGroup

  # ---------------------------------------------------------------------------
  # Sheet: IP
  # ---------------------------------------------------------------------------
  IP:
    required: true
    columns:

      NODE:
        required: true
        type: string
        pattern: ".*SBC.*"
        description: "SBC Hostname (must contain SBC)"

      NIAM NAME:
        required: true
        type: string
        unique: true
        description: "NIAM ID for the hostname - must be unique to each node"

  # ---------------------------------------------------------------------------
  # Sheet: CRFTargetList
  # ---------------------------------------------------------------------------
  CRFTargetList:
    required: false
    required_if_listed_in: Index.TABLES
    columns:

      Group:
        required: true
        type: string
        description: "Group name for the configuration changes"

      Action:
        required: true
        type: string
        allowedValues: [CREATE, DELETE, MODIFY]
        description: "Action to be performed"

      SubAction:
        required: true
        type: string
        allowedValues: [RECORD, SUBRECORD]
        description: "Operation level"

      ActionKey:
        required: false
        type: string
        allowedValues: [Record.CRFTargetListEntry]
        description: "Required when SubAction is SUBRECORD"

      ID:
        required: true
        type: integer
        minValue: 1
        maxValue: 6000
        description: "ID of the table"

      NAME:
        required: true
        type: string
        maxLength: 19
        pattern: "(\\S|\\S[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*\\S)"
        description: "Logical name of the table"

      Record.TARGET_LIST_ID:
        required: true
        type: integer
        minValue: 1
        maxValue: 100000
        description: "The CRF Target List Record ID"

      Record.DESCRIPTION:
        required: false
        type: string
        maxLength: 32
        pattern: "[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*"
        description: "Required when Action is CREATE"

      Record.LOCATION:
        required: false
        type: string
        allowedValues: [Access, Core]
        allowedValuesWhen:
        - column: Record.TARGET_TYPE
          operator: equals
          value: "Type 2"
          allowedValues: [Core]
        description: "Required when Action is CREATE"

      Record.TARGET_TYPE:
        required: false
        type: string
        allowedValues: ["Type 1", "Type 2", "IBCF Trunk Group"]
        description: "Required when Action is CREATE"

      Record.CRFTargetListEntry.TARGET_ID:
        required: false
        type: integer
        allowedRanges:
          - { min: 1, max: 1024 }
          - { min: 5001, max: 7048 }
          - { min: 0, max: 0 }
        allowedValuesWhen:
        - column: Record.TARGET_TYPE
          operator: equals
          value: "IBCF Trunk Group"
          allowedValues: [0]
        description: "Required when Action is CREATE; range 1..1024, 5001..7048, or 0"

      Record.CRFTargetListEntry.TRANSPORT_TYPE:
        required: false
        type: string
        allowedValues: [UDP, TCP, SCTP, TLS, ANY]
        description: "Required when Action is CREATE"

      Record.CRFTargetListEntry.VN_ID:
        required: false
        type: integer
        minValue: 0
        maxValue: 4096
        allowedValuesWhen:
        - column: Record.TARGET_TYPE
          operator: "notEquals"
          value: "IBCF Trunk Group"
          allowedValues: [0]
        description: "Virtual Network ID; must be 0 when TARGET_TYPE is not IBCF Trunk Group"

      Record.CRFTargetListEntry.TG_ID:
        required: false
        type: integer
        minValue: 0
        maxValue: 32
        allowedValuesWhen:
        - column: Record.TARGET_TYPE
          operator: "notEquals"
          value: "IBCF Trunk Group"
          allowedValues: [0]
        description: "Trunk Group ID; must be 0 when TARGET_TYPE is not IBCF Trunk Group"

      Record.CRFTargetListEntry.ORDER:
        required: false
        type: string
        allowedValues: ["10", "20"]
        description: "10=preferred, 20=alternate"

      Record.CRFTargetListEntry.PRIORITY:
        required: false
        type: string
        allowedValues: ["10", "20", "30"]
        description: "10=preferred, 20=second choice, 30=tertiary"

      Record.CRFTargetListEntry.WEIGHT:
        required: false
        type: integer
        minValue: 0
        maxValue: 100
        description: "Relative weight for equal Order and Priority"

      Record.CRFTargetListEntry.COST_TBL_INDEX:
        required: false
        type: integer
        minValue: 0
        maxValue: 2500
        description: "Time of Day Cost Table Index"

      Record.TARGET_LIST_SELECTION_OPTION:
        required: false
        type: string
        allowedValues: ["Order/Priority/Weight", "TOD Cost Index"]

    rules:
      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD
      - require: '"Record.CRFTargetListEntry.TARGET_ID"'
        when:
          column: Action
          operator: equals
          value: CREATE
      - require: '"Record.CRFTargetListEntry.TRANSPORT_TYPE"'
        when:
          column: Action
          operator: equals
          value: CREATE
      - require: '"Record.CRFTargetListEntry.VN_ID"'
        when:
          column: Action
          operator: equals
          value: CREATE
      - require: '"Record.CRFTargetListEntry.TG_ID"'
        when:
          column: Action
          operator: equals
          value: CREATE
      - require: '"Record.CRFTargetListEntry.ORDER"'
        when:
          column: Action
          operator: equals
          value: CREATE
      - require: '"Record.CRFTargetListEntry.PRIORITY"'
        when:
          column: Action
          operator: equals
          value: CREATE
      - require: '"Record.CRFTargetListEntry.WEIGHT"'
        when:
          column: Action
          operator: equals
          value: CREATE
      - forbid: '"Record.LOCATION"'
        when:
          column: Action
          operator: equals
          value: MODIFY
      - forbid: '"Record.TARGET_TYPE"'
        when:
          column: Action
          operator: equals
          value: MODIFY

  # ---------------------------------------------------------------------------
  # Sheet: PeeringSDPProfileTable
  # ---------------------------------------------------------------------------
  PeeringSDPProfileTable:
    required: false
    required_if_listed_in: Index.TABLES
    columns:

      Group:
        required: true
        type: string

      Action:
        required: true
        type: string
        allowedValues: [CREATE, DELETE, MODIFY]

      SubAction:
        required: true
        type: string
        allowedValues: [RECORD, SUBRECORD]

      ActionKey:
        required: false
        type: string
        allowedValues: [Record.CodecBandwidth, Record.MsrpBandwidth]

      ID:
        required: true
        type: integer
        minValue: 0
        maxValue: 1630

      NAME:
        required: true
        type: string
        maxLength: 19
        pattern: "(\\S|\\S[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*\\S)"

      Record.PROFILEID:
        required: true
        type: integer
        minValue: 1
        maxValue: 2048
        description: "Required when Action is CREATE"

      Record.DESCRIPTION:
        required: false
        type: string
        maxLength: 128
        pattern: "[a-zA-Z0-9\\*#\\.,\\-'!$()&><%/=;\\\\ ]*"

      Record.SDP_OFFER_FROM_PEERING_SIDE:
        required: false
        type: string
        allowedValues: [Yes, No]

      Record.SDP_ANSWER_FROM_PEERING_SIDE:
        required: false
        type: string
        allowedValues: [Yes, No]

      Record.SDP_OFFER_FROM_CORE_SIDE:
        required: false
        type: string
        allowedValues: [Yes, No]

      Record.SDP_ANSWER_FROM_CORE_SIDE:
        required: false
        type: string
        allowedValues: [Yes, No]

      Record.GoldenCodecSet.GOLDEN_CODEC:
        required: false
        type: string
        allowedValues: [PCMU, PCMA, G723, G729, AMR, EVRC0, EVRCB0, G726-16, G726-24, G726-32, G726-40, G728, AMR-WB, GSM, GSM-EFR, GSM-HR, G722, OPUS, EVS]

      Record.CodecBandwidth.CODEC:
        required: false
        type: string
        allowedValues: [H263-2000, H264, MP4V-ES, PCMU, PCMA, G723, G729, AMR, EVRC0, EVRCB0, G726-16, G726-24, G726-32, G726-40, G728, AMR-WB, GSM, GSM-EFR, GSM-HR, G722, OPUS, EVS, SILK-NB, SILK-MB, SILK-WB, SILK-SWB, iSAC-16, iSAC-32, VP8, t140]

      Record.CodecBandwidth.BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240

      Record.CodecBandwidth.CODEC_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480

      Record.CodecBandwidth.CODEC_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480

      Record.DEFAULTAUDIOBANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 510

      Record.DEFAULT_AUDIO_CODEC_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048

      Record.DEFAULT_AUDIO_CODEC_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048

      Record.DEFAULTVIDEOBANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240

      Record.DEFAULT_VIDEO_CODEC_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480

      Record.DEFAULT_VIDEO_CODEC_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480

      Record.MAXIMUMPACKETTIME:
        required: false
        type: integer
        minValue: 0
        maxValue: 255

      Record.AuxiliaryCodecSet.AUXILIARY_CODEC:
        required: false
        type: string
        allowedValues: [CN, DTMF]

      Record.SDES_SRTP_SUPPORTED:
        required: false
        type: string
        allowedValues: [No, "Non-3GPP SDES-SRTP", "3GPP SDES-SRTP"]

      Record.LATCH_4_MEDIA_CONNECTIONS:
        required: false
        type: string
        allowedValues: [Yes, No]

      Record.RTCP_MUX_SUPPORT:
        required: false
        type: string
        allowedValues: [Yes, No]

      Record.ICE_SUPPORT:
        required: false
        type: string
        allowedValues: [No, "ICE Lite Support Peering"]

      Record.SIGNAL_ICE_LITE_IN_SDP:
        required: false
        type: string
        allowedValues: [Yes, No]
        allowedValuesWhen:
        - column: Record.ICE_SUPPORT
          operator: equals
          value: "No"
          allowedValues: [No]
        description: "If Record.ICE_SUPPORT is 'No', then Record.SIGNAL_ICE_LITE_IN_SDP must be 'No'"

      Record.RINGBACK_TONE_FOR_CALLING_PARTY:
        required: false
        type: string
        allowedValues: [Off, "MS Teams Support", "Carrier Support"]

      Record.SEND_RBT_SDP_ANSWER_TO_CALLING_PARTY:
        required: false
        type: string
        allowedValues: [On, Off]

      Record.DEFAULT_TEXT_CODEC_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 256
        description: "Required when Action is CREATE; applicable on a per media type basis"

      Record.DEFAULT_TEXT_CODEC_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048
        description: "Required when Action is CREATE"

      Record.DEFAULT_TEXT_CODEC_MAXBURSTSIZE_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048
        description: "Required when Action is CREATE"

      Record.MsrpBandwidth.MSRP_MEDIA_TYPE:
        required: false
        type: string
        allowedValues: [text, image, audio, video, application, multipart, message]
        description: "Required when Action is CREATE"

      Record.MsrpBandwidth.MSRP_MEDIA_TYPE_MAX_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240
        description: "Required when Action is CREATE"

      Record.MsrpBandwidth.MSRP_MEDIA_TYPE_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Required when Action is CREATE"

      Record.MsrpBandwidth.MSRP_MEDIA_TYPE_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Required when Action is CREATE"

      Record.DEFAULT_MSRP_MEDIA_TYPE_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Required when Action is CREATE"

      Record.DEFAULT_MSRP_MEDIA_TYPE_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Required when Action is CREATE"

      Record.MODE_CHANGE_PERIOD:
        required: false
        type: string
        allowedValues: ["NULL", "1", "2"]
        description: "Required when Action is CREATE"

      Record.INSERT_AMR_NB_CODEC_WITH_MODE_SET:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.PreferredAMRNBModeSet.PREFERRED_AMR_NB_MODE_SET:
        required: false
        type: string
        allowedValues: ["4.75", "5.15", "5.9", "6.7", "7.4", "7.95", "10.2", "12.2"]
        description: "Required when Action is CREATE"

      Record.PreferredAMRWBModeSet.PREFERRED_AMR_WB_MODE_SET:
        required: false
        type: string
        allowedValues: ["6.6", "8.85", "12.65", "14.25", "15.85", "18.25", "19.85", "23.05", "23.85"]
        description: "Required when Action is CREATE"

      Record.REUSE_SDP_PAYLOAD_NUMBER_IF_NO_MODE_SET_IN_SDP_OFFER:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.AMR_PREFERRED_MODESET_PRIORITY:
        required: false
        type: string
        allowedValues: [Before, After]
        description: "Required when Action is CREATE"

      Record.DEFAULT_APPLICATION_MEDIA_TYPE_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240
        description: "Default bandwidth allowed for m= line media type of 'application'"

      Record.DEFAULT_APPLICATION_MEDIA_TYPE_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048
        description: "Default peak bandwidth allowed for m= line media type of 'application'"

      Record.DEFAULT_APPLICATION_MEDIA_TYPE_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048
        description: "Default max burst size allowed for m= line media type of 'application'"

      Record.DEFAULT_IMAGE_MEDIA_TYPE_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240
        description: "Default bandwidth allowed for m= line media type of 'image'"

      Record.DEFAULT_IMAGE_MEDIA_TYPE_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Default allowable Peak bandwidth settings for image media type"

      Record.DEFAULT_IMAGE_MEDIA_TYPE_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Default allowable Max Burst Size settings for image media type"

      Record.DEFAULT_OTHER_MEDIA_TYPE_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240
        description: "Default bandwidth allowed for m= lines of unknown media type"

      Record.DEFAULT_OTHER_MEDIA_TYPE_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Default peak bandwidth allowed for m= lines of unknown media type"

      Record.DEFAULT_OTHER_MEDIA_TYPE_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Default max burst size allowed for m= lines of unknown media type"

      Record.VIDEO_FRAME_RATE_4_IPV4_IPV6_BANDWIDTH_INTERWORKING:
        required: false
        type: integer
        minValue: 1
        maxValue: 250
        description: "Required when Action is CREATE"

      Record.INTELLIGENT_TRANSCODING_SUPPORT:
        required: false
        type: string
        allowedValues: [Yes, No]
        allowedValuesWhen:
        - column: Record.STRICT_CLOCK_RATE_MATCHING_GCL_AUDIO_CODECS
          operator: equals
          value: "Yes"
          allowedValues: [Yes]
        description: "Must be 'Yes' when STRICT_CLOCK_RATE_MATCHING_GCL_AUDIO_CODECS is 'Yes'"

      Record.SUPPORT_EVS_AMR_WB_IO_MODE:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.MIN_ALLOWED_EVS_BR:
        required: false
        type: string
        allowedValues: ["0", "5.9", "7.2", "8", "9.6", "13.2", "16.4", "24.4", "32", "48", "64", "96", "128"]
        description: "Required when Action is CREATE; applicable when SDP validation is enabled"

      Record.MIN_ALLOWED_EVS_BW:
        required: false
        type: string
        allowedValues: [none, nb, wb, swb, fb]
        description: "Required when Action is CREATE; applicable when SDP validation is enabled"

      Record.MAX_ALLOWED_EVS_BW:
        required: false
        type: string
        allowedValues: [none, nb, wb, swb, fb]
        description: "Required when Action is CREATE; applicable when SDP validation is enabled"

      Record.STRICT_CLOCK_RATE_MATCHING_GCL_AUDIO_CODECS:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Enable strict matching of clock-rate of selected GCL codecs to OCL codecs"

      Record.PRESCRIBED_DTMF_PT_FOR_EGRESS_SDP_OFFER:
        required: false
        type: integer
        allowedRanges:
          - { min: 0, max: 0 }
          - { min: 96, max: 127 }
        description: "Required when Action is CREATE; 0 or range 96..127"

      Record.DEFAULT_MSRP_MEDIA_TYPE_MAX_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240
        description: "Required when Action is CREATE"

      Record.INSERT_AMR_WB_CODEC_WITH_MODE_SET:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.MAX_ALLOWED_EVS_BR:
        required: false
        type: string
        allowedValues: ["0", "5.9", "7.2", "8", "9.6", "13.2", "16.4", "24.4", "32", "48", "64", "96", "128"]
        description: "Required when Action is CREATE; applicable when SDP validation is enabled"

    rules:
      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD
      - require: '"Record.MsrpBandwidth.MSRP_MEDIA_TYPE"'
        when:
          column: Action
          operator: equals
          value: CREATE
      - require: '"Record.CodecBandwidth.CODEC"'
        when:
          column: Action
          operator: equals
          value: CREATE
      

  # ---------------------------------------------------------------------------
  # Sheet: BorderGatewayPublishedRealmTable (Excel sheet name is truncated to 31 chars)
  # ---------------------------------------------------------------------------
  BorderGatewayPublishedRealmTable:
    aliases:
      - BorderGatewayPublishedRealmTab
    required: false
    required_if_listed_in: Index.TABLES
    columns:

      Group:
        required: true
        type: string

      Action:
        required: true
        type: string
        allowedValues: [CREATE, DELETE, MODIFY]

      SubAction:
        required: true
        type: string
        allowedValues: [RECORD, SUBRECORD]

      ActionKey:
        required: false
        type: string
        allowedValues: [Record.PUBLISHED_REALM_ENTRY]

      ID:
        required: true
        type: integer
        minValue: 1
        maxValue: 999
        description: "ID of the table"

      NAME:
        required: true
        type: string
        maxLength: 19
        pattern: "(\\S|\\S[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*\\S)"

      Record.BORDER_GATEWAY:
        required: true
        type: integer
        minValue: 1024
        maxValue: 1346
        description: "Required when Action is CREATE; must equal COMPONENTNUMBER of Border GW component"

      Record.PUBLISHED_REALM_ENTRY.PUBLISHED_REALM_ID:
        required: false
        type: integer
        minValue: 1
        maxValue: 1024
        description: "Required when Action is CREATE; must be previously created in PublishedRealmTable"

    rules:
      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD
      - require: '"Record.PUBLISHED_REALM_ENTRY.PUBLISHED_REALM_ID"'
        when:
          column: Action
          operator: equals
          value: CREATE

  # ---------------------------------------------------------------------------
  # Sheet: IbcfVirtualNetworkTable
  # ---------------------------------------------------------------------------
  IbcfVirtualNetworkTable:
    required: false
    required_if_listed_in: Index.TABLES
    columns:

      Group:
        required: true
        type: string

      Action:
        required: true
        type: string
        allowedValues: [CREATE, DELETE, MODIFY]

      SubAction:
        required: true
        type: string
        allowedValues: [RECORD]

      ActionKey:
        required: false
        type: string

      ID:
        required: true
        type: integer
        minValue: 0
        maxValue: 1628

      NAME:
        required: true
        type: string
        maxLength: 19
        pattern: "(\\S|\\S[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*\\S)"

      Record.VN_ID:
        required: true
        type: integer
        unique: true
        minValue: 1
        maxValue: 4096
        description: "Virtual Network ID"

      Record.VN_NAME:
        required: false
        type: string
        maxLength: 32
        pattern: "[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*"
        description: "Required when Action is CREATE"

      Record.VN_TYPE:
        required: false
        type: string
        allowedValues: [Core, Peer]
        description: "Required when Action is CREATE; cannot be changed for existing VN"

      Record.SERVICE_LEVEL_POLICY_ID:
        required: false
        type: integer
        minValue: 0
        description: "0 or equal to ServiceProfileTable.POLICY_ID"

      Record.SIP_ERROR_RESP_CODE:
        required: false
        type: integer
        minValue: 0
        maxValue: 699
        description: "Required when Action is CREATE; error response sent when request rejected due to CAC"

      Record.PEERING_ISGW_PROFILE_ID:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048

      Record.MEDIA_REALM:
        required: false
        type: integer
        description: "Required when Action is CREATE"

      Record.TRUNK_CONTEXT:
        required: false
        type: string
        maxLength: 128
        pattern: "[a-zA-Z0-9\\*#\\.,\\-'!$()&><%/=;\\\\ ]*"
        description: "Required when Action is CREATE"

      Record.CFED_PORT:
        required: false
        type: string
        description: "Required when Action is CREATE; empty when VN_TYPE=Peer"

      Record.PFED_PORT:
        required: false
        type: string
        allowedValuesWhen:
        - column: Record.VN_TYPE
          operator: equals
          value: "Core"
          allowedValues: [""]
        description: "Required when Action is CREATE; empty when VN_TYPE=Core"

      Record.SPARE_TABLE_ID:
        required: false
        type: integer
        minValue: 0
        maxValue: 10000

      Record.MEASUREMENT_TG_TRAFFIC:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.MEASUREMENT_ISGW_POLICY:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.MEASUREMENT_CAC:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.ENABLE_STIR_SHAKEN:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.VERIFICATION_FAILURE_ACTION:
        required: false
        type: string
        allowedValues: ["Verification Server Action", Continue]
        description: "Required when Action is CREATE; must be 0 if ENABLE_STIR_SHAKEN is No"

      Record.IPSEC_SA_PROFILE_ID:
        required: false
        type: integer
        allowedRanges:
          - { min: 0, max: 0 }
          - { min: 1, max: 2048 }
        description: "0 = no IPsec SA profile; 1..2048 = profile ID"

      Record.REMOTE_IPSEC_TUNNEL_GW_ADDR:
        required: false
        type: string
        maxLength: 45
        pattern: "[a-fA-F0-9:.]*"
        description: "Required when Action is CREATE; IPv4/IPv6 remote IPsec tunnel gateway address"

      Record.IKE_REMOTE_SERVER_PORT:
        required: false
        type: integer
        allowedRanges:
          - { min: 0, max: 0 }
          - { min: 500, max: 500 }
          - { min: 1024, max: 65535 }
        description: "Required when Action is CREATE; 0, 500, or 1024..65535"

      Record.IC_INTERFACE_ALLOWED_SIP_HEADERS_LIST:
        required: false
        type: integer
        allowedRanges:
          - { min: 0, max: 0 }
          - { min: 1, max: 100 }
        description: "Required when Action is CREATE; 0 = not configured"

      Record.ENABLE_DIV_SIGNING_VERIFICATION:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.HONOR_RECEIVED_IDENTITY_HEADERS:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.HONOR_RECEIVED_VERSTAT:
        required: false
        type: string
        allowedValues: [Yes, No]
        description: "Required when Action is CREATE"

      Record.MAX_DIV_SIGNING_DEPTH:
        required: false
        type: integer
        minValue: 1
        maxValue: 127
        description: "Required when Action is CREATE"

    rules:
      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD

      - forbid: '"Record.IPSEC_SA_PROFILE_ID"'
        when:
          column: Action
          operator: equals
          value: MODIFY
      - forbid: '"Record.REMOTE_IPSEC_TUNNEL_GW_ADDR"'
        when:
          column: Action
          operator: equals
          value: MODIFY
      - forbid: '"Record.IKE_REMOTE_SERVER_PORT"'
        when:
          column: Action
          operator: equals
          value: MODIFY
