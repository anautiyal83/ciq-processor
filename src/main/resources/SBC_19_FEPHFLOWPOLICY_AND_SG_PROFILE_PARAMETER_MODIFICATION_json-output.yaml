# ---------------------------------------------------------------------------
# JSON output template SBC FEPHFLOWPOLICY_SG_PROFILE_PARAMETER_MODIFICATION
# ---------------------------------------------------------------------------
# This file is referenced from SBC_FEPHFLOWPOLICY_SG_PROFILE_PARAMETER_MODIFICATION_validation-rules.yaml
# via:  json_output_file: "SBC_FEPHFLOWPOLICY_SG_PROFILE_PARAMETER_MODIFICATION_json-output.yaml"
# ---------------------------------------------------------------------------
# It is also consumed directly by:
#   - JAVA_NOKIA_CLICR_AUTOMATION  (MOP generation + approval summary + execution reporting)
# ---------------------------------------------------------------------------
output_mode: single
data:
  schemaVersion: "2"
  meta:
    nodeType: SBC
    activity: 19_FEPHFLOWPOLICY_AND_SG_PROFILE_PARAMETER_MODIFICATION
    tableKeys:
      _optional: true
      FephFlowPolicyTable:
        recordPrimaryKeys: "POLICY_ID"

      SecurityGatewayProfile:
        recordPrimaryKeys: "PROFILE_ID"

      SpareRecordsTable:
        recordPrimaryKeys: "SPARE_ID"
        immutableFields:
          record:
            - ASSIGNMENT_TYPE


      CPIDefinition:
        recordPrimaryKeys: "CPI_ID"
      

      CPIProfile:
        recordPrimaryKeys: "GRANULARITY,PROFILE_ID"
        subrecordKeys:
          CPIRecord: "CPI_ID"
        

      SipAggregateTrustedRateLimitSet:
        recordPrimaryKeys: "RULE_ID"
        

      SipAggregateUntrustedRateLimitSet:
        recordPrimaryKeys: "RULE_ID"
        

      SipTrustedRateLimitSet:
        recordPrimaryKeys: "RULE_ID"
        

      SipUntrustedRateLimitSet:
        recordPrimaryKeys: "RULE_ID"
        

  nodeGroups:
    _each: "DISTINCT INDEX.NODEGROUP AS $ng"
    nodeGroup: $ng
    crGroup:   "INDEX.CRGROUP WHERE INDEX.NODEGROUP = $ng"
    email:     "INDEX.EMAIL WHERE INDEX.NODEGROUP = $ng"
    nodes:
      _each: "IP WHERE IP.NODEGROUP = $ng"
      node:   IP.NODE
      niamID: "IP.'NIAM NAME'"
    configSequences:
      _each: "DISTINCT INDEX.CONFIG_SEQ WHERE INDEX.NODEGROUP = $ng AS $seq"
      configSeq: $seq
      tables:
        _each: "DISTINCT INDEX.TABLES WHERE INDEX.NODEGROUP = $ng AND INDEX.CONFIG_SEQ = $seq AS $table"
        table:    $table
        category: "INDEX.CATEGORY WHERE INDEX.NODEGROUP = $ng AND INDEX.CONFIG_SEQ = $seq AND INDEX.TABLES = $table"
        records:
          _each: "$table WHERE NODEGROUP = $ng AND CONFIG_SEQ = $seq"
          data:
            _row: "*"
