# =============================================================================
# Validation Rules: SBC - 127_NEW_MGW_IPSUBNET_CREATION
# File naming convention: {NODE_TYPE}_{ACTIVITY}_validation-rules.yaml
#
# Use-case:
#   Validate SBC MGW IPSubnet Configuration CIQ sheets.
#   Covers 3 sheets: Index, IP, and IP_SUBNET tables.
# =============================================================================

version: "1.0"
skipValidationValues: [MANO_EMPTY]

# -----------------------------------------------------------------------------
# Global settings
# -----------------------------------------------------------------------------
settings:
  headerRow: 0
  dataStartRow: 1
  trimCellValues: false
  ignoreBlankRows: true
  caseSensitiveHeaders: false
  caseSensitiveValues: true

# -----------------------------------------------------------------------------
# Workbook-level cross-sheet rules
# -----------------------------------------------------------------------------
workbook_rules:

  # Index.NODE must exist in IP.NODE
  - subset:
      from: Index.Node
      to: IP.Node
      
  - superset:
      from: Index.Node
      to: IP_SUBNET.Node

# -----------------------------------------------------------------------------
# Sheet-wise validation rules
# -----------------------------------------------------------------------------

sheets:

  # ---------------------------------------------------------------------------
  # Sheet: Index
  # ---------------------------------------------------------------------------
  Index:
    required: true
    columns:

      Node:
        required: true
        type: string

      CRGROUP:
        required: true
        description: "CR Number"
        type: string
        pattern: "^CR[0-9]+$"

      EMAIL:    
        type: email
        multi: true
        description: "Email ID"
        consolidate: true
        consolidate_separator: ";"
        minOnePerGroup:
            groupByColumn: CRGroup
            
    rules:
      - unique_key: [Node, CRGROUP]

  # ---------------------------------------------------------------------------
  # Sheet: IP
  # ---------------------------------------------------------------------------
  IP:
    required: true
    columns:

      NODE:
        required: true
        type: string

      NIAM NAME:
        required: true
        type: string
        description: "NIAM ID for the hostname - must be unique to each node"
      
    rules:
      - unique_key: [NODE, NIAM NAME]
 
  # ---------------------------------------------------------------------------
  # Sheet: IP_SUBNET
  # ---------------------------------------------------------------------------
  IP_SUBNET:
    required: true

    columns:

      Node:
        required: true
        type: string
        
      MGW:
        required: true
        type: integer
        minValue: 1

      IP_TYPE:
        required: true
        type: string
        allowedValues: [IPV4, IPV6]
        dropdownDisabled: true
        
      PORT:
        required: true
        type: string
        
      IP_ADDRESS:
        required: true
        type: string
        conditionalPattern:
          startColumn: IP_TYPE          # seed from the sibling column in this row
          lookupChain:
            - sheet: IP_SUBNET  # the sheet IP_ADDRESS lives in
              joinOn: IP_TYPE
              extract: IP_TYPE           # resolves back to the row's IP_TYPE value
          rules:
            - when: "^IPV4$"
              pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
              message: "IP_ADDRESS '{value}' is not a valid IPv4 address"
            - when: "^IPV6$"
              pattern: '^(?:(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,7}:|(?:[0-9A-Fa-f]{1,4}:){1,6}:[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,5}(?::[0-9A-Fa-f]{1,4}){1,2}|(?:[0-9A-Fa-f]{1,4}:){1,4}(?::[0-9A-Fa-f]{1,4}){1,3}|(?:[0-9A-Fa-f]{1,4}:){1,3}(?::[0-9A-Fa-f]{1,4}){1,4}|(?:[0-9A-Fa-f]{1,4}:){1,2}(?::[0-9A-Fa-f]{1,4}){1,5}|[0-9A-Fa-f]{1,4}:(?:(?::[0-9A-Fa-f]{1,4}){1,6})|:(?:(?::[0-9A-Fa-f]{1,4}){1,7}|:))$'
              message: "IP_ADDRESS '{value}' is not a valid IPv6 address"

      IPV6_PREFIX_LENGTH:
        required: false
        type: string
        pattern: '^(?:[0-9]|[1-9][0-9]|1[01][0-9]|12[0-8])$'
        allowedValuesWhen:
        - column: IP_TYPE
          operator: equals
          value: IPV4
          allowedValues: [""]
        dropdownDisabled: true
        description: "empty when IP_TYPE is 'IPV4'. When IP_TYPE is IPV6, range is 0 ...128"

      IPV4_SUBNET_MASK:
        required: false
        type: string
        pattern: '^(?:(((255\.){3}(255|254|252|248|240|224|192|128|0+))|((255\.){2}(254|252|248|240|224|192|128|0+)\.0+)|((255\.)(254|252|248|240|224|192|128|0+)(\.0+){2})|((254|252|248|240|224|192|128|0+)(\.0+){3})))$'
        allowedValuesWhen:
        - column: IP_TYPE
          operator: equals
          value: IPV6
          allowedValues: [""]
        dropdownDisabled: true  
        description: "empty when IP_TYPE is 'IPV6'. For IPv4, its mandatory and valid contiguous"
      
      VLANID:
        required: true
        type: integer
        allowedRanges:
          - { min: 1, max: 4094 }
      
      IP_REALM:
        required: true
        type: string
      
      NH_SESSION:
        required: true
        type: integer
        minValue: 1  
        
      GATEWAY_ADDRESS:
        required: true
        type: string
        conditionalPattern:
          startColumn: IP_TYPE          # seed from the sibling column in this row
          lookupChain:
            - sheet: IP_SUBNET  # the sheet IP_ADDRESS lives in
              joinOn: IP_TYPE
              extract: IP_TYPE           # resolves back to the row's IP_TYPE value
          rules:
            - when: "^IPV4$"
              pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
              message: "IP_ADDRESS '{value}' is not a valid IPv4 address"
            - when: "^IPV6$"
              pattern: '^(?:(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,7}:|(?:[0-9A-Fa-f]{1,4}:){1,6}:[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,5}(?::[0-9A-Fa-f]{1,4}){1,2}|(?:[0-9A-Fa-f]{1,4}:){1,4}(?::[0-9A-Fa-f]{1,4}){1,3}|(?:[0-9A-Fa-f]{1,4}:){1,3}(?::[0-9A-Fa-f]{1,4}){1,4}|(?:[0-9A-Fa-f]{1,4}:){1,2}(?::[0-9A-Fa-f]{1,4}){1,5}|[0-9A-Fa-f]{1,4}:(?:(?::[0-9A-Fa-f]{1,4}){1,6})|:(?:(?::[0-9A-Fa-f]{1,4}){1,7}|:))$'
              message: "IP_ADDRESS '{value}' is not a valid IPv6 address"
      COST:
        required: true
        type: integer
        minValue: 1

    rules:
      - require: IPV6_PREFIX_LENGTH
        when:
          column: IP_TYPE
          operator: equals
          value: IPV6

      - require: IPV4_SUBNET_MASK
        when:
          column: IP_TYPE
          operator: equals
          value: IPV4

outputs:
  # Distinct CR group identifiers from the Index sheet
  CR_LIST:
    sheet: Index
    column: CRGROUP
    aggregate: distinct
    separator: ","
 
  # Total number of announcement file rows
  CR_COUNT:
    sheet: Index
    column: CRGROUP
    aggregate: distinct_count