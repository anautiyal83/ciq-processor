output_mode: single
data:
 schemaVersion: "2"
 meta:
   nodeType: SBC
   activity: 5_ADDITION_DELETION_MODIFICATION_OF_SIP_FILTER_MM_IN_SBC
   tableKeys:
    _optional: true
    SipFilter:
      recordPrimaryKeys: "FILTER_ID"
      subrecordKeys:
        HBR_RULE_EXECUTION_ORDER: "RULE_TYPE,RULE_ID"
      immutableFields:
        subrecord:
          HBR_RULE_EXECUTION_ORDER:
            - RULE_TYPE
            - RULE_ID

    SipFilterHeaderRule:
      recordPrimaryKeys: "FILTER_ID,HEADER_ID"

    SipFilterBodyRule:
      recordPrimaryKeys: "FILTER_ID,BODY_RULE_ID"

    SipFilterRefRule:
      recordPrimaryKeys: "FILTER_ID,REF_RULE_ID"

    SipFilterSet:
      recordPrimaryKeys: "FILTER_SET_ID"
      
 nodeGroups:
   _each: "DISTINCT INDEX.NODEGROUP AS $ng"
   nodeGroup: $ng
   crGroup:   "INDEX.CRGROUP WHERE INDEX.NODEGROUP = $ng"
   email:     "INDEX.EMAIL WHERE INDEX.NODEGROUP = $ng"
   nodes:
     _each: "IP WHERE IP.NODEGROUP = $ng"
     node:   IP.NODE
     niamID: "IP.'NIAM NAME'"
   configSequences:
     _each: "DISTINCT INDEX.CONFIG_SEQ WHERE INDEX.NODEGROUP = $ng AS $seq"
     configSeq: $seq
     tables:
       _each: "DISTINCT INDEX.TABLES WHERE INDEX.NODEGROUP = $ng AND INDEX.CONFIG_SEQ = $seq AS $table"
       table:    $table
       category: "INDEX.CATEGORY WHERE INDEX.NODEGROUP = $ng AND INDEX.CONFIG_SEQ = $seq AND INDEX.TABLES = $table"
       records:
         _each: "$table WHERE NODEGROUP = $ng AND CONFIG_SEQ = $seq"
         data:
           _row: "*"