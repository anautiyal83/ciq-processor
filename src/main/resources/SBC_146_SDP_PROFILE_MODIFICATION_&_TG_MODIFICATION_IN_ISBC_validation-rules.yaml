    rules:

      - unique_key: [NodeGroup, CONFIG_SEQ, ActionKey, Record.PROFILE_ID]
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: SubAction
              operator: notEquals
              value: TABLE

      - unique_key: [NodeGroup, CONFIG_SEQ, ActionKey, Record.PROFILE_ID]
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: SubAction
              operator: notEquals
              value: TABLE

      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD

      - forbid: ActionKey
        when:
          column: SubAction
          operator: notEquals
          value: SUBRECORD

      # --- TABLE handling: record keys required only for non-TABLE rows; table uniqueness ---
      - require: '"Record.PROFILE_ID"'
        when:
          column: SubAction
          operator: notEquals
          value: TABLE
      - unique_key: [NodeGroup, CONFIG_SEQ, ID, NAME]
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: SubAction
              operator: equals
              value: TABLE
      - unique_key: [NodeGroup, CONFIG_SEQ, ID, NAME]
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: SubAction
              operator: equals
              value: TABLE


  # ---------------------------------------------------------------------------
  # Sheet: CdrServiceProfileTable
  # ---------------------------------------------------------------------------
  CdrServiceProfileTable:
    required: false
    required_if_listed_in: Index.TABLES
    columns:

      NodeGroup:
        required: true
        type: string

      CONFIG_SEQ:
        required: true
        type: string
        pattern: '^Step\d+$'
        
      Action:
        required: true
        type: string
        allowedValues: [CREATE, MODIFY, DELETE]
        dropdownDisabled: true
        
      SubAction:
        required: true
        type: string
        allowedValues: [RECORD, TABLE]
        allowedValuesWhen:
        - column: Action
          operator: equals
          value: MODIFY
          allowedValues: [RECORD]
        dropdownDisabled: true

      ActionKey:
        required: false
        type: string

      ID:
        required: true
        type: integer
        minValue: 1
        maxValue: 999

      NAME:
        required: true
        type: string
        minLength: 1
        maxLength: 19
        pattern: "(\\S|\\S[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*\\S)"
        

      Record.CDR_POOL_ID:
        required: false
        type: integer
        minValue: 0
        maxValue: 255

      Record.ACTIVATE_LOCAL_CCF:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true

    rules:

      - forbid: ActionKey
        when:
          column: SubAction
          operator: notEquals
          value: SUBRECORD

      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD

      - unique_key: [NodeGroup, CONFIG_SEQ, Record.CDR_POOL_ID]
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: SubAction
              operator: notEquals
              value: TABLE

      - unique_key: [NodeGroup, CONFIG_SEQ, Record.CDR_POOL_ID]
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: SubAction
              operator: notEquals
              value: TABLE

      # --- TABLE handling: record keys required only for non-TABLE rows; table uniqueness ---
      - require: '"Record.CDR_POOL_ID"'
        when:
          column: SubAction
          operator: notEquals
          value: TABLE
      - unique_key: [NodeGroup, CONFIG_SEQ, ID, NAME]
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: SubAction
              operator: equals
              value: TABLE
      - unique_key: [NodeGroup, CONFIG_SEQ, ID, NAME]
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: SubAction
              operator: equals
              value: TABLE


outputs:
  # Distinct CR group identifiers from the Index sheet
  CR_LIST:
    sheet: Index
    column: CRGROUP
    aggregate: distinct
    separator: ","

  # Count of unique CRGroup values
  CR_COUNT:
    sheet: Index
    column: CRGROUP
    aggregate: distinct_count