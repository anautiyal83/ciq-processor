        description: "Required when Action is CREATE"

      Record.SUPPORT_TLS_SYMMETRIC:
        required: false
        type: string
        allowedValues: [No, Always, NAT]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE"

    rules:
      - require: '"Record.REMOTEIPADDRESSList.REMOTEIPADDRESS"'
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: ActionKey
              operator: equals
              value: Record.REMOTEIPADDRESSList

      - require: '"Record.REMOTEIPADDRESSList.REMOTEIPADDRESS"'
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: ActionKey
              operator: equals
              value: Record.REMOTEIPADDRESSList

      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD

      - forbid: ActionKey
        when:
          column: SubAction
          operator: notEquals
          value: SUBRECORD
      
      - unique_key: [NodeGroup, CONFIG_SEQ, ActionKey, Record.VN_ID, Record.TG_ID]
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: SubAction
              operator: notEquals
              value: TABLE

      - unique_key: [NodeGroup, CONFIG_SEQ, ActionKey, Record.VN_ID, Record.TG_ID]
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: SubAction
              operator: notEquals
              value: TABLE

      # --- TABLE handling: record keys required only for non-TABLE rows; table uniqueness ---
      - require: '"Record.VN_ID"'
        when:
          column: SubAction
          operator: notEquals
          value: TABLE
      - require: '"Record.TG_ID"'
        when:
          column: SubAction
          operator: notEquals
          value: TABLE
      - unique_key: [NodeGroup, CONFIG_SEQ, ID, NAME]
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: SubAction
              operator: equals
              value: TABLE
      - unique_key: [NodeGroup, CONFIG_SEQ, ID, NAME]
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: SubAction
              operator: equals
              value: TABLE

  # ---------------------------------------------------------------------------
  # Sheet: IMSACRChargingProfileTable
  # ---------------------------------------------------------------------------
  IMSACRChargingProfileTable:
    required: false
    required_if_listed_in: Index.TABLES
    columns:

      NodeGroup:
        required: true
        type: string

      CONFIG_SEQ:
        required: true
        type: string
        pattern: '^Step\d+$'
        
      Action:
        required: true
        type: string
        allowedValues: [CREATE, MODIFY, DELETE]
        dropdownDisabled: true
        
      SubAction:
        required: true
        type: string
        allowedValues: [RECORD, SUBRECORD, TABLE]
        allowedValuesWhen:
        - column: Action
          operator: equals
          value: MODIFY
          allowedValues: [RECORD, SUBRECORD]
        dropdownDisabled: true
       
      ActionKey:
        required: false
        type: string
        allowedValues: [Record.DetailedACRMsgGenerationOption , Record.DetailedACRMsgAVPPopulationOption]
        dropdownDisabled: true
      
      ID:
        required: true
        type: integer
        minValue: 1
        maxValue: 1500

      NAME:
        required: true
        type: string
        minLength: 1
        maxLength: 19
        pattern: "(\\S|\\S[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*\\S)"

      Record.PROFILE_ID:
        required: false
        type: integer
        minValue: 0
        maxValue: 256

      Record.TRAFFIC_MONITOR:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true

      Record.VERSION_CONTROL_SELECTION:
        required: false
        type: string
        allowedValues: ["3GPP 32.225 Rel 5.7.0", "3GPP 32.260 Rel 7.4.0", "3GPP 32.260 Rel 8.6.0", "3GPP 32.260 Flexible"]
        dropdownDisabled: true
        
      Record.RELEASE_NUMBER:
        required: false
        type: integer
        minValue: 9
        maxValue: 9999
        allowedValuesWhen:
        - column: Record.VERSION_CONTROL_SELECTION
          operator: notEquals
          value: "3GPP 32.260 Flexible"
          allowedValues: [9]
        
      Record.EXTENSION_NUMBER:
        required: false
        type: string
        minLength: 0
        maxLength: 10
        pattern: '[^.@ ]*'
        allowedValuesWhen:
        - column: Record.VERSION_CONTROL_SELECTION
          operator: notEquals
          value: "3GPP 32.260 Flexible"
