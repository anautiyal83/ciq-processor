# =============================================================================
# Validation Rules: ISBC - SDP_PROFILE_MODIFICATION / TG_MODIFICATION
# File naming convention: {NODE_TYPE}_{ACTIVITY}_validation-rules.yaml
#
# Use-case:
#   Validate ISBC SDP Profile / Trunk-Group modification CIQ sheets.
#   Covers 6 sheets: Index, IP, and 4 record-based configuration tables.
# =============================================================================

version: "1.0"

# -----------------------------------------------------------------------------
# Global settings
# -----------------------------------------------------------------------------
settings:
  headerRow: 0
  dataStartRow: 1
  trimCellValues: true
  ignoreBlankRows: true
  caseSensitiveHeaders: false
  caseSensitiveValues: true

# -----------------------------------------------------------------------------
# Workbook-level cross-sheet rules
# -----------------------------------------------------------------------------
workbook_rules:

  - contiguous_sequence:
      sheet: Index
      partitionBy: [NodeGroup, CRGROUP]
      column: CONFIG_SEQ

  # Index.NodeGroup must exist in IP.NodeGroup
  - subset:
      from: Index.NodeGroup
      to: IP.NodeGroup

  # GROUP validation scoped by TABLES column.
  - superset:
      from: Index.NodeGroup
      where: "TABLES = PeeringSDPProfileTable"
      to: PeeringSDPProfileTable.NodeGroup
  - superset:
      from: Index.NodeGroup
      where: "TABLES = IbcfTrunkGroupTable"
      to: IbcfTrunkGroupTable.NodeGroup
  - superset:
      from: Index.NodeGroup
      where: "TABLES = IMSACRChargingProfileTable"
      to: IMSACRChargingProfileTable.NodeGroup
  - superset:
      from: Index.NodeGroup
      where: "TABLES = CdrServiceProfileTable"
      to: CdrServiceProfileTable.NodeGroup


  - set:
      bidirectional: true
      from:
        sheet: Index
        column: CONFIG_SEQ
        partitionBy: [NodeGroup, CRGROUP]
        where: "TABLES = PeeringSDPProfileTable"
      to:
        sheet: PeeringSDPProfileTable
        column: CONFIG_SEQ
        partitionBy: [NodeGroup]
  - set:
      bidirectional: true
      from:
        sheet: Index
        column: CONFIG_SEQ
        partitionBy: [NodeGroup, CRGROUP]
        where: "TABLES = IbcfTrunkGroupTable"
      to:
        sheet: IbcfTrunkGroupTable
        column: CONFIG_SEQ
        partitionBy: [NodeGroup]
  - set:
      bidirectional: true
      from:
        sheet: Index
        column: CONFIG_SEQ
        partitionBy: [NodeGroup, CRGROUP]
        where: "TABLES = IMSACRChargingProfileTable"
      to:
        sheet: IMSACRChargingProfileTable
        column: CONFIG_SEQ
        partitionBy: [NodeGroup]
  - set:
      bidirectional: true
      from:
        sheet: Index
        column: CONFIG_SEQ
        partitionBy: [NodeGroup, CRGROUP]
        where: "TABLES = CdrServiceProfileTable"
      to:
        sheet: CdrServiceProfileTable
        column: CONFIG_SEQ
        partitionBy: [NodeGroup]

# -----------------------------------------------------------------------------
# Sheet-wise validation rules
# -----------------------------------------------------------------------------
sheets:

  # ---------------------------------------------------------------------------
  # Sheet: Index
  # ---------------------------------------------------------------------------
  Index:
    required: true
    columns:

      NodeGroup:
        required: true
        type: string

      CRGROUP:
        required: true
        description: "CR Number"
        type: string
        pattern: "^CR[0-9]+$"

      CONFIG_SEQ:
        required: true
        type: string
        pattern: '^Step\d+$'

      TABLES:
        required: true
        type: string
        description: "Table Name of Configuration"

      CATEGORY:
        required: true
        type: string
        allowedValues: [RecordBased, Global]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Category - RecordBased or Global level configuration"

      EMAIL:
        type: email
        multi: true
        description: "Email ID"
        consolidate: true
        consolidate_separator: ";"
        minOnePerGroup:
            groupByColumn: CRGroup

    rules:
      - unique_key: [NodeGroup, CRGROUP, CONFIG_SEQ, TABLES]

  # ---------------------------------------------------------------------------
  # Sheet: IP
  # ---------------------------------------------------------------------------
  IP:
    required: true
    columns:

      NODE:
        required: true
        type: string

      NIAM NAME:
        required: true
        type: string
        description: "NIAM ID for the hostname - must be unique to each node"

      NodeGroup:
        required: true
        type: string

    rules:
      - unique_key: [NODE, NIAM NAME, NodeGroup]
  # ---------------------------------------------------------------------------
  # Sheet: PeeringSDPProfileTable
  # ---------------------------------------------------------------------------
  PeeringSDPProfileTable:
    required: false
    required_if_listed_in: Index.TABLES
    columns:

      NodeGroup:
        required: true
        type: string
      
      CONFIG_SEQ:
        required: true
        type: string
        pattern: '^Step\d+$'

      Action:
        required: true
        type: string
        allowedValues: [CREATE, DELETE, MODIFY]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      SubAction:
        required: true
        type: string
        allowedValues: [RECORD, SUBRECORD, TABLE]
        allowedValuesWhen:
        - column: Action
          operator: equals
          value: MODIFY
          allowedValues: [RECORD, SUBRECORD]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      ActionKey:
        required: false
        type: string
        allowedValues: [Record.CodecBandwidth, Record.MsrpBandwidth, Record.GoldenCodecSet, Record.AuxiliaryCodecSet, Record.PreferredAMRNBModeSet, Record.PreferredAMRWBModeSet]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      ID:
        required: true
        type: integer
        minValue: 0
        maxValue: 1630

      NAME:
        required: true
        type: string
        maxLength: 19
        pattern: "(\\S|\\S[a-zA-Z0-9\\*#\\.,\\-+'~`!@$%^:;=(){}\\[\\]?\"'&<>/_|\\\\ ]*\\S)"

      Record.PROFILEID:
        required: false
        type: integer
        minValue: 1
        maxValue: 2048
        description: "Required when Action is CREATE"

      Record.DESCRIPTION:
        required: false
        type: string
        maxLength: 128
        pattern: "[a-zA-Z0-9\\*#\\.,\\-'!$()&><%/=;\\\\ ]*"

      Record.SDP_OFFER_FROM_PEERING_SIDE:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.SDP_ANSWER_FROM_PEERING_SIDE:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.SDP_OFFER_FROM_CORE_SIDE:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.SDP_ANSWER_FROM_CORE_SIDE:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.GoldenCodecSet.GOLDEN_CODEC:
        required: false
        type: string
        allowedValues: [PCMU, PCMA, G723, G729, AMR, EVRC0, EVRCB0, G726-16, G726-24, G726-32, G726-40, G728, AMR-WB, GSM, GSM-EFR, GSM-HR, G722, OPUS, EVS]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.CodecBandwidth.CODEC:
        required: false
        type: string
        allowedValues: [H263-2000, H264, MP4V-ES, PCMU, PCMA, G723, G729, AMR, EVRC0, EVRCB0, G726-16, G726-24, G726-32, G726-40, G728, AMR-WB, GSM, GSM-EFR, GSM-HR, G722, OPUS, EVS, SILK-NB, SILK-MB, SILK-WB, SILK-SWB, iSAC-16, iSAC-32, VP8, t140]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.CodecBandwidth.BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240

      Record.CodecBandwidth.CODEC_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480

      Record.CodecBandwidth.CODEC_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480

      Record.DEFAULTAUDIOBANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 510

      Record.DEFAULT_AUDIO_CODEC_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048

      Record.DEFAULT_AUDIO_CODEC_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048

      Record.DEFAULTVIDEOBANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240

      Record.DEFAULT_VIDEO_CODEC_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480

      Record.DEFAULT_VIDEO_CODEC_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480

      Record.MAXIMUMPACKETTIME:
        required: false
        type: integer
        minValue: 0
        maxValue: 255

      Record.AuxiliaryCodecSet.AUXILIARY_CODEC:
        required: false
        type: string
        allowedValues: [CN, DTMF]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.SDES_SRTP_SUPPORTED:
        required: false
        type: string
        allowedValues: [No, "Non-3GPP SDES-SRTP", "3GPP SDES-SRTP"]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.LATCH_4_MEDIA_CONNECTIONS:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.RTCP_MUX_SUPPORT:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.ICE_SUPPORT:
        required: false
        type: string
        allowedValues: [No, "ICE Lite Support Peering"]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.SIGNAL_ICE_LITE_IN_SDP:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        allowedValuesWhen:
        - column: Record.ICE_SUPPORT
          operator: equals
          value: "No"
          allowedValues: [No]
        description: "If Record.ICE_SUPPORT is 'No', then Record.SIGNAL_ICE_LITE_IN_SDP must be 'No'"

      Record.RINGBACK_TONE_FOR_CALLING_PARTY:
        required: false
        type: string
        allowedValues: [Off, "MS Teams Support", "Carrier Support"]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.SEND_RBT_SDP_ANSWER_TO_CALLING_PARTY:
        required: false
        type: string
        allowedValues: [On, Off]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      Record.DEFAULT_TEXT_CODEC_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 256
        description: "Required when Action is CREATE; applicable on a per media type basis"

      Record.DEFAULT_TEXT_CODEC_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048
        description: "Required when Action is CREATE"

      Record.DEFAULT_TEXT_CODEC_MAXBURSTSIZE_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048
        description: "Required when Action is CREATE"

      Record.MsrpBandwidth.MSRP_MEDIA_TYPE:
        required: false
        type: string
        allowedValues: [text, image, audio, video, application, multipart, message]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE"

      Record.MsrpBandwidth.MSRP_MEDIA_TYPE_MAX_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240
        description: "Required when Action is CREATE"

      Record.MsrpBandwidth.MSRP_MEDIA_TYPE_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Required when Action is CREATE"

      Record.MsrpBandwidth.MSRP_MEDIA_TYPE_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Required when Action is CREATE"

      Record.DEFAULT_MSRP_MEDIA_TYPE_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Required when Action is CREATE"

      Record.DEFAULT_MSRP_MEDIA_TYPE_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Required when Action is CREATE"

      Record.SPARE_TABLE_ID:
        required: false
        type: integer
        minValue: 0
        maxValue: 10000

      Record.MODE_CHANGE_PERIOD:
        required: false
        type: string
        allowedValues: ["NULL", "1", "2"]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE"

      Record.INSERT_AMR_NB_CODEC_WITH_MODE_SET:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE"

      Record.PreferredAMRNBModeSet.PREFERRED_AMR_NB_MODE_SET:
        required: false
        type: string
        allowedValues: ["4.75", "5.15", "5.9", "6.7", "7.4", "7.95", "10.2", "12.2"]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE"

      Record.PreferredAMRWBModeSet.PREFERRED_AMR_WB_MODE_SET:
        required: false
        type: string
        allowedValues: ["6.6", "8.85", "12.65", "14.25", "15.85", "18.25", "19.85", "23.05", "23.85"]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE"

      Record.REUSE_SDP_PAYLOAD_NUMBER_IF_NO_MODE_SET_IN_SDP_OFFER:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE"

      Record.AMR_PREFERRED_MODESET_PRIORITY:
        required: false
        type: string
        allowedValues: [Before, After]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE"

      Record.DEFAULT_APPLICATION_MEDIA_TYPE_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240
        description: "Default bandwidth allowed for m= line media type of 'application'"

      Record.DEFAULT_APPLICATION_MEDIA_TYPE_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048
        description: "Default peak bandwidth allowed for m= line media type of 'application'"

      Record.DEFAULT_APPLICATION_MEDIA_TYPE_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 2048
        description: "Default max burst size allowed for m= line media type of 'application'"

      Record.DEFAULT_IMAGE_MEDIA_TYPE_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240
        description: "Default bandwidth allowed for m= line media type of 'image'"

      Record.DEFAULT_IMAGE_MEDIA_TYPE_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Default allowable Peak bandwidth settings for image media type"

      Record.DEFAULT_IMAGE_MEDIA_TYPE_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Default allowable Max Burst Size settings for image media type"

      Record.DEFAULT_OTHER_MEDIA_TYPE_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240
        description: "Default bandwidth allowed for m= lines of unknown media type"

      Record.DEFAULT_OTHER_MEDIA_TYPE_PEAK_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Default peak bandwidth allowed for m= lines of unknown media type"

      Record.DEFAULT_OTHER_MEDIA_TYPE_MAX_BURST_SIZE:
        required: false
        type: integer
        minValue: 0
        maxValue: 20480
        description: "Default max burst size allowed for m= lines of unknown media type"

      Record.VIDEO_FRAME_RATE_4_IPV4_IPV6_BANDWIDTH_INTERWORKING:
        required: false
        type: integer
        minValue: 1
        maxValue: 250
        description: "Required when Action is CREATE"

      Record.INTELLIGENT_TRANSCODING_SUPPORT:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        allowedValuesWhen:
        - column: Record.STRICT_CLOCK_RATE_MATCHING_GCL_AUDIO_CODECS
          operator: equals
          value: "Yes"
          allowedValues: [Yes]
        description: "Must be 'Yes' when STRICT_CLOCK_RATE_MATCHING_GCL_AUDIO_CODECS is 'Yes'"

      Record.SUPPORT_EVS_AMR_WB_IO_MODE:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE"

      Record.MIN_ALLOWED_EVS_BR:
        required: false
        type: string
        allowedValues: ["0", "5.9", "7.2", "8", "9.6", "13.2", "16.4", "24.4", "32", "48", "64", "96", "128"]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE; applicable when SDP validation is enabled"

      Record.MIN_ALLOWED_EVS_BW:
        required: false
        type: string
        allowedValues: [none, nb, wb, swb, fb]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE; applicable when SDP validation is enabled"

      Record.MAX_ALLOWED_EVS_BW:
        required: false
        type: string
        allowedValues: [none, nb, wb, swb, fb]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE; applicable when SDP validation is enabled"

      Record.STRICT_CLOCK_RATE_MATCHING_GCL_AUDIO_CODECS:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Enable strict matching of clock-rate of selected GCL codecs to OCL codecs"

      Record.PRESCRIBED_DTMF_PT_FOR_EGRESS_SDP_OFFER:
        required: false
        type: integer
        allowedRanges:
          - { min: 0, max: 0 }
          - { min: 96, max: 127 }
        description: "Required when Action is CREATE; 0 or range 96..127"

      Record.DEFAULT_MSRP_MEDIA_TYPE_MAX_BANDWIDTH:
        required: false
        type: integer
        minValue: 0
        maxValue: 10240
        description: "Required when Action is CREATE"

      Record.INSERT_AMR_WB_CODEC_WITH_MODE_SET:
        required: false
        type: string
        allowedValues: [Yes, No]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE"

      Record.MAX_ALLOWED_EVS_BR:
        required: false
        type: string
        allowedValues: ["0", "5.9", "7.2", "8", "9.6", "13.2", "16.4", "24.4", "32", "48", "64", "96", "128"]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ
        description: "Required when Action is CREATE; applicable when SDP validation is enabled"

    rules:
      - unique_key: [NodeGroup, CONFIG_SEQ, SubAction, ActionKey, Record.PROFILEID, Record.CodecBandwidth.CODEC, Record.MsrpBandwidth.MSRP_MEDIA_TYPE]
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: SubAction
              operator: notEquals
              value: TABLE

      - unique_key: [NodeGroup, CONFIG_SEQ, SubAction, ActionKey, Record.PROFILEID, Record.CodecBandwidth.CODEC, Record.MsrpBandwidth.MSRP_MEDIA_TYPE]
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: SubAction
              operator: notEquals
              value: TABLE
          
      - require: '"Record.GoldenCodecSet.GOLDEN_CODEC"'
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: ActionKey
              operator: equals
              value: Record.GoldenCodecSet

      - require: '"Record.GoldenCodecSet.GOLDEN_CODEC"'
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: ActionKey
              operator: equals
              value: Record.GoldenCodecSet

      - require: '"Record.AuxiliaryCodecSet.AUXILIARY_CODEC"'
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: ActionKey
              operator: equals
              value: Record.AuxiliaryCodecSet

      - require: '"Record.AuxiliaryCodecSet.AUXILIARY_CODEC"'
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: ActionKey
              operator: equals
              value: Record.AuxiliaryCodecSet

      - require: '"Record.PreferredAMRNBModeSet.PREFERRED_AMR_NB_MODE_SET"'
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: ActionKey
              operator: equals
              value: Record.PreferredAMRNBModeSet
      
      - require: '"Record.PreferredAMRWBModeSet.PREFERRED_AMR_WB_MODE_SET"'
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: ActionKey
              operator: equals
              value: Record.PreferredAMRWBModeSet

      - require: '"Record.PreferredAMRNBModeSet.PREFERRED_AMR_NB_MODE_SET"'
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: ActionKey
              operator: equals
              value: Record.PreferredAMRNBModeSet
      
      - require: '"Record.PreferredAMRWBModeSet.PREFERRED_AMR_WB_MODE_SET"'
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: ActionKey
              operator: equals
              value: Record.PreferredAMRWBModeSet 

      - require: ActionKey
        when:
          column: SubAction
          operator: equals
          value: SUBRECORD

      - forbid: ActionKey
        when:
          column: SubAction
          operator: notEquals
          value: SUBRECORD

      - require: '"Record.MsrpBandwidth.MSRP_MEDIA_TYPE"'
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: ActionKey
              operator: equals
              value: Record.MsrpBandwidth

      - require: '"Record.MsrpBandwidth.MSRP_MEDIA_TYPE"'
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: ActionKey
              operator: equals
              value: Record.MsrpBandwidth

      - require: '"Record.CodecBandwidth.CODEC"'
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: ActionKey
              operator: equals
              value: Record.CodecBandwidth

      - require: '"Record.CodecBandwidth.CODEC"'
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: ActionKey
              operator: equals
              value: Record.CodecBandwidth

      # --- TABLE handling: record keys required only for non-TABLE rows; table uniqueness ---
      - require: '"Record.PROFILEID"'
        when:
          column: SubAction
          operator: notEquals
          value: TABLE
      - unique_key: [NodeGroup, CONFIG_SEQ, ID, NAME]
        when:
          all:
            - column: Action
              operator: equals
              value: CREATE
            - column: SubAction
              operator: equals
              value: TABLE
      - unique_key: [NodeGroup, CONFIG_SEQ, ID, NAME]
        when:
          all:
            - column: Action
              operator: equals
              value: DELETE
            - column: SubAction
              operator: equals
              value: TABLE

  # ---------------------------------------------------------------------------
  # Sheet: IbcfTrunkGroupTable
  # ---------------------------------------------------------------------------
  IbcfTrunkGroupTable:
    required: false
    required_if_listed_in: Index.TABLES
    columns:

      NodeGroup:
        required: true
        type: string
        
      
      CONFIG_SEQ:
        required: true
        type: string
        pattern: '^Step\d+$'

      Action:
        required: true
        type: string
        allowedValues: [CREATE, DELETE, MODIFY]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      SubAction:
        required: true
        type: string
        allowedValues: [RECORD, SUBRECORD, TABLE]
        allowedValuesWhen:
        - column: Action
          operator: equals
          value: MODIFY
          allowedValues: [RECORD, SUBRECORD]
        dropdownDisabled: true        # validates allowed values but skips dropdown in generated CIQ

      ActionKey:
        required: false
        type: string
        allowedValues: [Record.REMOTEIPADDRESSList]
        dropdownDisabled: true   

      ID:
        required: true
        type: integer
        minValue: 0
        maxValue: 1628

      NAME:
        required: true
        type: string
